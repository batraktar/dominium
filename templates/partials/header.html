{% load static %}
{% load socialaccount %}
<header class="dominium-site-header">
  <div class="dominium-site-header__inner container">
    <div class="dominium-site-header__row">
      <div class="dominium-site-header__brand">
        <a href="/" aria-label="DOMINIUM — головна сторінка"{% if request.path == '/' %} aria-current="page"{% endif %}>
          <img src="{% static 'base/assets/img/Logoblack.png' %}" alt="DOMINIUM Logo" width="220" height="56" decoding="async" />
        </a>
      </div>
      <nav class="dominium-site-header__nav" aria-label="Основна навігація">
        <a href="/" class="dominium-site-header__link{% if request.path == '/' %} is-active{% endif %}"{% if request.path == '/' %} aria-current="page"{% endif %}>Головна</a>
        <a href="/search/" class="dominium-site-header__link{% if request.path|slice:':7' == '/search' %} is-active{% endif %}"{% if request.path|slice:':7' == '/search' %} aria-current="page"{% endif %}>Пошук</a>
        <a href="/likes/" class="dominium-site-header__link{% if request.path|slice:':6' == '/likes' %} is-active{% endif %}"{% if request.path|slice:':6' == '/likes' %} aria-current="page"{% endif %}>Обране</a>
        {% if request.user.is_staff %}
          <a href="{% url 'property_api_admin' %}" class="dominium-site-header__link dominium-site-header__admin-link{% if request.path|slice:':10' == '/api/admin' %} is-active{% endif %}"{% if request.path|slice:':10' == '/api/admin' %} aria-current="page"{% endif %}>
            <i class="ri-dashboard-line" aria-hidden="true"></i>
            API адмінка
          </a>
        {% endif %}
      </nav>
      <div class="dominium-site-header__actions">
        <div class="dominium-site-header__socials">
          <a href="https://www.facebook.com/61573653220530/" aria-label="Facebook DOMINIUM"><i class="ri-facebook-fill ri-lg"></i></a>
          <a href="https://www.instagram.com/dominium_realty_agency" aria-label="Instagram DOMINIUM"><i class="ri-instagram-fill ri-lg"></i></a>
          <a href="https://www.tiktok.com/@dominium_realty_agency" aria-label="TikTok DOMINIUM"><i class="ri-tiktok-fill ri-lg"></i></a>
        </div>
        {% if request.user.is_authenticated %}
          <div class="dominium-site-header__account">
            <span>Привіт, {{ request.user.display_name }}</span>
            <button type="button" data-logout-url="{% url 'logout' %}" class="dominium-site-header__logout">Вийти</button>
          </div>
        {% else %}
          <button type="button" data-google-auth data-auth-url="{% url 'google_popup_start' %}" class="dominium-site-header__auth-button dominium-site-header__auth-button--secondary">Зареєструватися</button>
          <button type="button" class="dominium-site-header__auth-button dominium-site-header__auth-button--primary" data-open-modal="login">Увійти</button>
        {% endif %}
      </div>
    </div>
  </div>
</header>

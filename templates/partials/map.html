<div class="bg-white p-4 sm:p-6 rounded-lg shadow-sm mb-4 sm:mb-10">
  <h3 class="text-xl text-deepOcean font-ermilov mb-4">Location</h3>

  {% if property.latitude and property.longitude %}
    <div class="h-[320px] rounded-lg overflow-hidden relative bg-white/10">
      <div
        id="map"
        class="w-full h-full z-0"
        data-lat="{{ property.latitude|default:'' }}"
        data-lon="{{ property.longitude|default:'' }}"
        data-title="{{ property.title|default:'' }}"
        data-address="{{ property.address|default:'' }}"
      ></div>
      <div id="map-controls" class="absolute top-2 right-2 z-10 bg-white rounded shadow px-2 py-1 text-sm font-fixel">
        <label class="mr-2"><input type="radio" name="basemap" value="map" />Map</label>
        <label><input type="radio" name="basemap" value="satellite" checked />Satellite</label>
      </div>
    </div>

    <div class="text-xs text-gray-400 font-fixel text-right mt-2">
      Дані карти: <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer" class="underline">© OpenStreetMap contributors</a>, Tiles: © Esri
    </div>
  {% else %}
    <div class="h-[320px] rounded-lg border border-white/30 bg-white/5 flex flex-col items-center justify-center text-sm font-fixel text-deepOcean/80 px-6 text-center">
      <i class="ri-map-pin-off-line text-2xl mb-2"></i>
      Координати цього об'єкта ще не додані. Зв’яжіться з менеджером, щоб отримати точну адресну точку.
    </div>
  {% endif %}
</div>

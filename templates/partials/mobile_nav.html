{% load socialaccount %}
<nav class="dominium-mobile-nav fixed bottom-0 left-0 right-0 z-50 border-t border-slate-200/70 bg-white/95 shadow-[0_-12px_30px_rgba(19,62,68,0.12)] backdrop-blur-md lg:hidden" aria-label="Нижня навігація">
  <div class="grid min-h-[76px] grid-flow-col auto-cols-fr px-2 py-2">
    <a href="/" class="flex flex-col items-center justify-center gap-1 text-[11px] font-fixel transition-colors duration-200 {% if request.path == '/' %}text-coolSage{% else %}text-deepOcean hover:text-coolSage{% endif %}"{% if request.path == '/' %} aria-current="page"{% endif %}>
      <i class="ri-home-5-line ri-lg" aria-hidden="true"></i><span class="text-xs mt-1">Головна</span>
    </a>
    <a href="/search/" class="flex flex-col items-center justify-center gap-1 text-[11px] font-fixel transition-colors duration-200 {% if request.path|slice:':7' == '/search' %}text-coolSage{% else %}text-deepOcean hover:text-coolSage{% endif %}"{% if request.path|slice:':7' == '/search' %} aria-current="page"{% endif %}>
      <i class="ri-search-line ri-lg" aria-hidden="true"></i><span class="text-xs mt-1">Пошук</span>
    </a>
    <a href="/likes/" class="flex flex-col items-center justify-center gap-1 text-[11px] font-fixel transition-colors duration-200 {% if request.path|slice:':6' == '/likes' %}text-coolSage{% else %}text-deepOcean hover:text-coolSage{% endif %}"{% if request.path|slice:':6' == '/likes' %} aria-current="page"{% endif %}>
      <i class="ri-heart-line ri-lg" aria-hidden="true"></i><span class="text-xs mt-1">Обране</span>
    </a>
    {% if request.user.is_staff %}
      <a href="{% url 'property_api_admin' %}" class="flex flex-col items-center justify-center gap-1 text-[11px] font-fixel transition-colors duration-200 {% if request.path|slice:':10' == '/api/admin' %}text-coolSage{% else %}text-deepOcean hover:text-coolSage{% endif %}"{% if request.path|slice:':10' == '/api/admin' %} aria-current="page"{% endif %}>
        <i class="ri-dashboard-line ri-lg" aria-hidden="true"></i><span class="text-xs mt-1">API</span>
      </a>
    {% endif %}
    {% if request.user.is_authenticated %}
      <button type="button" data-logout-url="{% url 'logout' %}" class="flex flex-col items-center justify-center gap-1 text-[11px] font-fixel text-deepOcean hover:text-coolSage">
        <i class="ri-logout-box-r-line ri-lg" aria-hidden="true"></i><span class="text-xs mt-1">Вийти</span>
      </button>
    {% else %}
      <button type="button" data-google-auth data-auth-url="{% url 'google_popup_start' %}" class="flex flex-col items-center justify-center gap-1 text-[11px] font-fixel text-deepOcean hover:text-coolSage">
        <i class="ri-user-add-line ri-lg" aria-hidden="true"></i><span class="text-xs mt-1">Кабінет</span>
      </button>
      <button type="button" class="flex flex-col items-center justify-center gap-1 text-[11px] font-fixel text-deepOcean hover:text-coolSage" data-open-modal="login">
        <i class="ri-login-circle-line ri-lg" aria-hidden="true"></i><span class="text-xs mt-1">Вхід</span>
      </button>
    {% endif %}
  </div>
</nav>
